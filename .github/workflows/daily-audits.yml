name: Daily site audits

# 7:00 AM Sydney time. GitHub schedules are UTC and do not follow daylight saving,
# so the workflow is queued at both 20:00 UTC (7:00 AEDT) and 21:00 UTC (7:00 AEST).
# GitHub often starts these late. The job still publishes one report for the
# Sydney day, and a second start the same day does not crawl again.
on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-site-audits
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Sydney daily gate
        id: gate
        run: |
          day=$(TZ=Australia/Sydney date +%F)
          hour=$(TZ=Australia/Sydney date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running because it was started by hand (Sydney $day $hour:00)."
            exit 0
          fi
          published=$(sed -n 's/.*"auditedOnIso": "\([^"]*\)".*/\1/p' form-audit.data.js | head -1)
          if [ "$published" = "$day" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping. The report is already dated $day."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running the $day audit. The published report is still dated ${published:-unknown}. Sydney time is $hour:00."
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Brand Signal
        if: steps.gate.outputs.run == 'true'
        id: brand
        run: node scripts/brand-signal-audit.js

      - name: Form Health
        if: steps.gate.outputs.run == 'true'
        id: form
        continue-on-error: true
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/form-health-audit.js

      - name: Publish the day's report
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add form-audit.data.js brand-numbers.data.js brand-numbers-audit-report.json
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update daily brand signal and form health"
          git push origin HEAD:main

      - name: Report a HubSpot failure
        if: steps.gate.outputs.run == 'true' && steps.form.outcome == 'failure'
        run: exit 1
